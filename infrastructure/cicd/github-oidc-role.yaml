AWSTemplateFormatVersion: '2010-09-09'
Description: One-time GitHub Actions OIDC and artifact-bucket bootstrap for the Student Management backend.

Parameters:
  ArtifactBucketName:
    Type: String
    Description: Globally unique S3 bucket used by AWS SAM deployment artifacts.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Existing token.actions.githubusercontent.com provider ARN; leave empty to create it.
  DeploymentRoleName:
    Type: String
    Default: student-management-backend-deployer

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Application
          Value: StudentManagementApi

  DeploymentArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: StudentManagementApi
        - Key: ManagedBy
          Value: CloudFormation

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeploymentRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - repo:JorgeQ12/LT_StudentManagement:environment:Development
                  - repo:JorgeQ12/LT_StudentManagement:environment:QA
                  - repo:JorgeQ12/LT_StudentManagement:environment:Production
      Policies:
        - PolicyName: student-management-sam-deployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageApplicationStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/student-management-api-*/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: UseDeploymentArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt DeploymentArtifactBucket.Arn
              - Sid: ManageDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${DeploymentArtifactBucket.Arn}/*
              - Sid: ManageLambdaFunctions
                Effect: Allow
                Action:
                  - lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:student-management-api-*
              - Sid: ManageApiGateway
                Effect: Allow
                Action:
                  - apigateway:*
                Resource: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/*
              - Sid: ManageGeneratedLambdaRoles
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/student-management-api-*
              - Sid: ResolveApplicationSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:student-management/*
      Tags:
        - Key: Application
          Value: StudentManagementApi
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  DeploymentRoleArn:
    Description: Configure this value as AWS_ROLE_ARN in each GitHub Environment.
    Value: !GetAtt GitHubDeploymentRole.Arn
  ArtifactBucketName:
    Description: Configure this value as AWS_SAM_BUCKET in each GitHub Environment.
    Value: !Ref DeploymentArtifactBucket
