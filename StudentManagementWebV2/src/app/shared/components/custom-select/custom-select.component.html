<div class="custom-select" [class.custom-select--open]="open()">
  <button
    class="custom-select__trigger"
    type="button"
    [id]="id()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-controls]="listId()"
    [attr.aria-expanded]="open()"
    [attr.aria-activedescendant]="activeDescendant()"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown)="handleKeydown($event)"
    (blur)="markTouched()"
  >
    <span [class.custom-select__placeholder]="!selectedOption()">
      {{ selectedOption()?.label ?? placeholder() }}
    </span>
    <app-icon name="chevronDown" size="1rem" />
  </button>

  @if (open()) {
    <div class="custom-select__menu" [id]="listId()" role="listbox">
      @for (option of options(); track option.value; let index = $index) {
        <button
          class="custom-select__option"
          type="button"
          role="option"
          [id]="id() + '-option-' + index"
          [class.is-focused]="focusedIndex() === index"
          [class.is-selected]="value() === option.value"
          [disabled]="option.disabled"
          [attr.aria-selected]="value() === option.value"
          (pointerdown)="$event.preventDefault()"
          (click)="select(option)"
        >
          <span>
            <strong>{{ option.label }}</strong>
            @if (option.description) {
              <small>{{ option.description }}</small>
            }
          </span>
          @if (value() === option.value) {
            <app-icon name="check" size="1rem" />
          }
        </button>
      }
    </div>
  }
</div>
