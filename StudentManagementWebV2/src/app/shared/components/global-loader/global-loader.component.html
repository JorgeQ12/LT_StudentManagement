@if (loading()) {
  <div class="loader" role="presentation">
    <section class="loader__dialog" role="status" aria-live="polite" aria-label="Cargando contenido">
      <div class="loader__spinner" aria-hidden="true"></div>
      <div>
        <strong>Procesando solicitud</strong>
        <span>Espera un momento, por favor.</span>
      </div>
    </section>
  </div>
}
