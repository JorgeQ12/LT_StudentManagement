<div class="panel grid min-h-64 place-items-center p-8 text-center">
  <div class="max-w-md">
    <span class="mx-auto grid size-12 place-items-center rounded-full bg-brand-50 text-brand-700">
      <ng-icon [name]="icon()" size="22" aria-hidden="true" />
    </span>
    <h2 class="mt-4 text-lg font-bold text-content">{{ title() }}</h2>
    <p class="mt-2 text-sm leading-6 text-content-muted">{{ description() }}</p>
    <div class="mt-5"><ng-content /></div>
  </div>
</div>
