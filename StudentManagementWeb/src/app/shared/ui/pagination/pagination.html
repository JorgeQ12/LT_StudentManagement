<nav
  class="flex flex-col gap-3 border-t px-4 py-4 sm:flex-row sm:items-center sm:justify-between"
  aria-label="Paginación"
>
  <p class="text-sm text-content-muted">
    Página <strong class="text-content">{{ pageNumber() }}</strong> de
    <strong class="text-content">{{ totalPages() }}</strong> · {{ totalCount() }} registros
  </p>
  <div class="flex gap-2">
    <button
      type="button"
      class="btn-secondary px-3"
      [disabled]="pageNumber() <= 1"
      aria-label="Página anterior"
      (click)="pageChange.emit(pageNumber() - 1)"
    >
      <sm-icon name="chevron-left" [size]="17" aria-hidden="true" />
      Anterior
    </button>
    <button
      type="button"
      class="btn-secondary px-3"
      [disabled]="pageNumber() >= totalPages()"
      aria-label="Página siguiente"
      (click)="pageChange.emit(pageNumber() + 1)"
    >
      Siguiente
      <sm-icon name="chevron-right" [size]="17" aria-hidden="true" />
    </button>
  </div>
</nav>
