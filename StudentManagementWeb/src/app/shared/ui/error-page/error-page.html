<main class="grid min-h-screen place-items-center bg-surface px-5 py-12">
  <section class="panel w-full max-w-xl overflow-hidden text-center">
    <div class="bg-brand-950 px-6 py-10 text-white">
      <sm-icon name="shield-check" [size]="34" class="inline-block text-white" />
      <p class="mt-4 text-sm font-bold tracking-[0.2em] text-brand-100 uppercase">
        Error {{ status() }}
      </p>
      <h1 class="mt-2 text-2xl font-bold sm:text-3xl">{{ title() }}</h1>
    </div>
    <div class="p-7 sm:p-9">
      <p class="leading-7 text-content-muted">{{ description() }}</p>
      <a routerLink="/" class="btn-primary mt-7">
        <sm-icon name="arrow-left" [size]="17" aria-hidden="true" />
        Volver al inicio
      </a>
    </div>
  </section>
</main>
