<div class="space-y-7">
  <sm-page-header
    [eyebrow]="copy().eyebrow"
    [title]="copy().title"
    [description]="copy().description"
  >
    <a [routerLink]="['/admin', resource(), 'new']" class="btn-primary">
      <ng-icon name="lucidePlus" size="17" aria-hidden="true" />
      {{ copy().create }}
    </a>
  </sm-page-header>

  <section class="panel overflow-hidden">
    <form
      class="flex flex-col gap-3 border-b p-4 sm:flex-row"
      (submit)="applyFilters($event, searchInput.value, statusSelect.value)"
    >
      <div class="relative flex-1">
        <ng-icon
          name="lucideSearch"
          size="17"
          class="pointer-events-none absolute top-3 left-3.5 text-content-muted"
          aria-hidden="true"
        />
        <input
          #searchInput
          type="search"
          class="form-control pl-10"
          [value]="search()"
          placeholder="Buscar por nombre o código"
          aria-label="Buscar registros"
        />
      </div>
      <select
        #statusSelect
        class="form-control sm:w-44"
        [value]="status()"
        aria-label="Filtrar por estado"
      >
        <option value="">Todos los estados</option>
        <option value="Active">Activos</option>
        <option value="Inactive">Inactivos</option>
      </select>
      <button type="submit" class="btn-secondary">Aplicar filtros</button>
    </form>

    @if (loading()) {
      <div class="p-5"><sm-loading-state label="Cargando registros…" /></div>
    } @else if (error()) {
      <div class="p-5">
        <sm-empty-state
          icon="lucideCircleAlert"
          title="No pudimos cargar los registros"
          [description]="error() || ''"
        >
          <button type="button" class="btn-primary" (click)="load()">Volver a intentar</button>
        </sm-empty-state>
      </div>
    } @else if (items().length === 0) {
      <div class="p-5">
        <sm-empty-state
          icon="lucideInbox"
          title="No encontramos registros"
          description="Prueba con otros filtros o crea un nuevo registro."
        >
          <a [routerLink]="['/admin', resource(), 'new']" class="btn-primary">{{
            copy().create
          }}</a>
        </sm-empty-state>
      </div>
    } @else {
      <sm-admin-resource-table
        [resource]="resource()"
        [items]="items()"
        [busyId]="busyId()"
        [pageNumber]="pageNumber()"
        [pageSize]="pageSize"
        [totalCount]="totalCount()"
        (statusChange)="toggleStatus($event)"
        (pageChange)="goToPage($event)"
      />
    }
  </section>
</div>
