<div class="shell">
  <header class="shell__header">
    <button
      class="shell__menu-button"
      type="button"
      (click)="toggleMenu()"
      aria-label="Abrir menú"
      [attr.aria-expanded]="menuOpen()"
    >
      <app-icon name="menu" />
    </button>
  </header>

  <aside class="shell__sidebar" [class.shell__sidebar--open]="menuOpen()">
    <div class="shell__sidebar-header">
      <span class="shell__sidebar-mark"><app-icon name="dashboard" size="1.1rem" /></span>
      <div><small>Portal académico</small><strong>Navegación</strong></div>
    </div>
    <p class="shell__section-label">Explorar</p>
    <nav aria-label="Navegación principal">
      @for (item of navigation(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{
            exact: item.route === '/admin' || item.route === '/student',
          }"
          (click)="closeMenu()"
        >
          <app-icon [name]="item.icon" />
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="shell__account">
      <div class="shell__account-identity">
        <span class="shell__account-avatar"><app-icon name="profile" size="1rem" /></span>
        <span>{{ user()?.email }}</span>
      </div>
      <button type="button" (click)="logout()"><app-icon name="logout" size="1rem" />Salir</button>
    </div>
  </aside>

  @if (menuOpen()) {
    <button
      class="shell__scrim"
      type="button"
      aria-label="Cerrar menú"
      (click)="closeMenu()"
    ></button>
  }

  <main class="shell__content" tabindex="-1">
    <router-outlet />
  </main>
</div>
